name: TauriWidgetExtension

options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

# Relative to this file: ../../node_modules/... (repo root).
# Requires: bun add tauri-plugin-widgets-api + postinstall Swift Package patch.
packages:
  TauriWidgets:
    path: ../../node_modules/tauri-plugin-widgets-api/swift

targets:
  TauriWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Demerzel
        CFBundleName: Demerzel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.demerzel.orchestrator.widgetkit
        PRODUCT_NAME: TauriWidgetExtension
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: TauriWidgetExtension.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Demerzel
        INFOPLIST_KEY_CFBundleName: Demerzel
    dependencies:
      - package: TauriWidgets
