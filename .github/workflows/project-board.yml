# Add every issue/PR to https://github.com/users/korzhanov/projects/13 and set Status.
#
# Secret: PROJECT_TOKEN — classic PAT with `repo` + `project`, or fine-grained with
# Issues/PRs read + Projects write (user project Demerzel #13 + repo korzhanov/demerzel).
#
# Status map:
#   open PR          → In review
#   draft PR         → In progress
#   closed/merged PR → Done
#   open issue       → Backlog
#   closed issue     → Done
#
# One-shot backfill: bun scripts/sync-project-board.mjs
name: Project board

on:
  issues:
    types: [opened, reopened, closed, transferred]
  pull_request:
    types:
      [
        opened,
        reopened,
        closed,
        converted_to_draft,
        ready_for_review,
      ]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-board-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Add to Demerzel project + Status
    runs-on: ubuntu-latest
    steps:
      - name: Skip if PROJECT_TOKEN missing
        id: gate
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add repo secret PROJECT_TOKEN (scopes: repo, project) to enable board sync."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target and status
        if: steps.gate.outputs.present == 'true'
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const isIssue = !!context.payload.issue;
            const item = isIssue ? context.payload.issue : context.payload.pull_request;
            let status = "Backlog";
            if (isIssue) {
              status = item.state === "closed" ? "Done" : "Backlog";
            } else if (item.merged || item.state === "closed") {
              status = "Done";
            } else if (item.draft) {
              status = "In progress";
            } else {
              status = "In review";
            }
            core.setOutput("node_id", item.node_id);
            core.setOutput("status", status);
            core.setOutput("url", item.html_url);
            console.log({ kind: isIssue ? "issue" : "pr", number: item.number, status });

      - name: Add to project and set Status
        if: steps.gate.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          NODE_ID: ${{ steps.meta.outputs.node_id }}
          STATUS_NAME: ${{ steps.meta.outputs.status }}
          ITEM_URL: ${{ steps.meta.outputs.url }}
        run: |
          set -euo pipefail
          PROJECT_ID="PVT_kwHOACIdh84BpdKI"
          STATUS_FIELD_ID="PVTSSF_lAHOACIdh84BpdKIzhn4vMQ"
          case "$STATUS_NAME" in
            Backlog) OPTION_ID="f75ad846" ;;
            Ready) OPTION_ID="61e4505c" ;;
            "In progress") OPTION_ID="47fc9ee4" ;;
            "In review") OPTION_ID="df73e18b" ;;
            Done) OPTION_ID="98236657" ;;
            *) echo "unknown status $STATUS_NAME"; exit 1 ;;
          esac

          ADD=$(gh api graphql -f query='
            mutation($project:ID!, $content:ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                item { id }
              }
            }' -f project="$PROJECT_ID" -f content="$NODE_ID")
          ITEM_ID=$(echo "$ADD" | jq -r '.data.addProjectV2ItemById.item.id // empty')
          if [ -z "$ITEM_ID" ]; then
            ITEM_ID=$(gh project item-list 13 --owner korzhanov --format json --limit 500 \
              | jq -r --arg u "$ITEM_URL" '.items[] | select(.content.url==$u) | .id' | head -1)
          fi
          test -n "$ITEM_ID"
          gh project item-edit \
            --id "$ITEM_ID" \
            --project-id "$PROJECT_ID" \
            --field-id "$STATUS_FIELD_ID" \
            --single-select-option-id "$OPTION_ID"
          echo "Set $ITEM_URL → $STATUS_NAME ($ITEM_ID)"
